<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ku-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ku-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="ku-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ku-grad-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" />

  <!-- Drone Central Hub -->
  <circle cx="32" cy="27" r="7" fill="url(#ku-grad-green)" />
  <circle cx="32" cy="27" r="3.5" fill="#ffffff" />

  <!-- Drone Rotors / Arms -->
  <!-- Top-Left Arm & Propeller -->
  <line x1="27" y1="22" x2="16" y2="14" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="14" cy="13" rx="7" ry="2.5" transform="rotate(-30 14 13)" fill="none" stroke="url(#ku-grad-gold)" stroke-width="2" />
  <circle cx="14" cy="13" r="1.5" fill="#ffffff" />

  <!-- Top-Right Arm & Propeller -->
  <line x1="37" y1="22" x2="48" y2="14" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="50" cy="13" rx="7" ry="2.5" transform="rotate(30 50 13)" fill="none" stroke="url(#ku-grad-gold)" stroke-width="2" />
  <circle cx="50" cy="13" r="1.5" fill="#ffffff" />

  <!-- Bottom-Left Arm & Propeller -->
  <line x1="27" y1="31" x2="18" y2="37" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="16" cy="38" rx="6" ry="2" transform="rotate(25 16 38)" fill="none" stroke="url(#ku-grad-gold)" stroke-width="1.8" />
  <circle cx="16" cy="38" r="1.5" fill="#ffffff" />

  <!-- Bottom-Right Arm & Propeller -->
  <line x1="37" y1="31" x2="46" y2="37" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="48" cy="38" rx="6" ry="2" transform="rotate(-25 48 38)" fill="none" stroke="url(#ku-grad-gold)" stroke-width="1.8" />
  <circle cx="48" cy="38" r="1.5" fill="#ffffff" />

  <!-- Agricultural Spraying Mist / Droplets -->
  <path d="M29 35 L26 43" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />
  <path d="M32 36 L32 45" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />
  <path d="M35 35 L38 43" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />

  <!-- Nurturing Crop Sprout / Green Field Base -->
  <path d="M20 54 Q32 46 44 54" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M32 50 C29 45 23 46 22 42 C26 42 30 46 32 50 Z" fill="#34d399" />
  <path d="M32 50 C35 45 41 46 42 42 C38 42 34 46 32 50 Z" fill="#10b981" />
</svg>
